# CI for the engine as its own repository. While it lives inside a monorepo, the monorepo's workflow runs the same
# steps with `working-directory: engine`.
name: engine
on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Conformance runs on every OS: the same ops must give the same hashes on Linux, macOS and Windows.
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: oven-sh/setup-bun@v2
      - name: Build the package
        working-directory: bindings/wasm
        run: bun install && bun run build
      - name: Generated TypeScript types are current
        run: git diff --exit-code bindings/wasm/types
      - name: Conformance in wasm
        working-directory: bindings/wasm
        run: bun test
      - name: Demo builds
        working-directory: apps/demo
        run: bun install && bun run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
