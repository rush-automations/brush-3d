[package]
name = "brush-wasm"
description = "The Brush engine for browsers, Node and Bun, built with wasm-bindgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brush-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# Skip binaryen's wasm-opt: one less tool to install, and the size win is not needed yet.
wasm-opt = false
