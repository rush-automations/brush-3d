<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brush engine demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside class="panel left">
      <h1>Brush engine</h1>
      <p class="muted" id="version"></p>

      <section>
        <h2>File</h2>
        <div class="row">
          <label class="button">Open PLY / OBJ<input type="file" id="file" accept=".ply,.obj" hidden /></label>
          <button id="sample">Sample</button>
        </div>
        <div class="row">
          <button data-export="ply">PLY</button>
          <button data-export="glb">GLB</button>
          <button data-export="obj">OBJ</button>
        </div>
      </section>

      <section>
        <h2>Brush <span class="muted">(left drag)</span></h2>
        <div class="tools" id="mode">
          <button data-mode="sculpt" aria-pressed="true">Sculpt</button>
          <button data-mode="spray" aria-pressed="false">Spray</button>
          <button data-mode="erase" aria-pressed="false">Erase</button>
        </div>
        <div id="sculptPanel">
          <div class="tools" id="brushes"></div>
          <label>Radius <input type="range" id="radius" min="0.02" max="1" step="0.01" value="0.2" /></label>
          <label>Strength <input type="range" id="strength" min="0.05" max="1" step="0.05" value="0.5" /></label>
          <div class="row">
            <label class="check"><input type="checkbox" id="invert" /> Invert</label>
            <label class="check">Colour <input type="color" id="color" value="#c2410c" /></label>
          </div>
        </div>
        <div id="sprayPanel" hidden>
          <p class="muted">Gaussian splats: paint in object space, sharp at any mesh resolution. Paint over a spot to build coverage.</p>
          <label>Radius <input type="range" id="sprayRadius" min="0.05" max="2" step="0.01" value="0.4" /></label>
          <label>Splat size <input type="range" id="spraySize" min="0.01" max="0.5" step="0.005" value="0.06" /></label>
          <label>Flow <input type="range" id="sprayFlow" min="0.05" max="1" step="0.05" value="0.5" /></label>
          <label>Opacity <input type="range" id="sprayOpacity" min="0.1" max="1" step="0.05" value="1" /></label>
          <label>Drip <input type="range" id="sprayDrip" min="0" max="1" step="0.05" value="0" /></label>
          <label>Variation <input type="range" id="sprayVariation" min="0" max="1" step="0.05" value="0.25" /></label>
          <label>Colour noise <input type="range" id="sprayNoise" min="0" max="1" step="0.05" value="0.15" /></label>
          <div class="row">
            <label class="check">Colour <input type="color" id="sprayColor" value="#b91c1c" /></label>
          </div>
          <div class="row">
            <button id="bakeSplats" title="Pour the splats into the vertex colours">Bake into mesh</button>
            <button id="clearSplats">Clear splats</button>
          </div>
        </div>
        <div id="erasePanel" hidden>
          <p class="muted">Rub out splats with the left button.</p>
          <label>Radius <input type="range" id="eraseRadius" min="0.02" max="1" step="0.01" value="0.2" /></label>
        </div>
      </section>

      <section>
        <h2>Whole mesh</h2>
        <div class="tools" id="meshOps"></div>
      </section>

      <section>
        <h2>View</h2>
        <div class="row">
          <label class="check"><input type="checkbox" id="flat" /> Flat</label>
          <label class="check"><input type="checkbox" id="wire" /> Wireframe</label>
        </div>
      </section>
    </aside>

    <main>
      <canvas id="view"></canvas>
      <div class="status" id="status"></div>
    </main>

    <aside class="panel right">
      <section>
        <h2>Mesh</h2>
        <dl id="stats"></dl>
        <div class="row">
          <button id="undo" title="Ctrl+Z">Undo</button>
          <button id="redo" title="Ctrl+Shift+Z">Redo</button>
          <button id="revert">Revert</button>
        </div>
      </section>

      <section>
        <h2>Ops console</h2>
        <p class="muted">Send any op as JSON, the way an AI model would. One op, or an array.</p>
        <textarea id="console" spellcheck="false" rows="7"></textarea>
        <div class="row">
          <button id="run">Apply</button>
          <button id="schema">Copy schema</button>
        </div>
        <p class="error" id="consoleError"></p>
      </section>

      <section class="grow">
        <h2>Journal</h2>
        <ol id="journal"></ol>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
