[package]
name = "brush-studio"
description = "Desktop and web studio for the Brush engine: orbit, edit, spray splats, and export PLY."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "brush-studio"

[dependencies]
brush-engine = { path = "../../crates/brush-engine" }
brush-render = { path = "../../crates/brush-render" }
brush-mesh = { path = "../../crates/brush-mesh" }
brush-io = { path = "../../crates/brush-io" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde_json = "1"
libm = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Url", "HtmlAnchorElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 2

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
