<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brush Studio</title>
    <base data-trunk-public-url />
    <link data-trunk rel="rust" data-bin="brush-studio" data-wasm-opt="0" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #17181c; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #9aa0aa; font: 14px/1.4 system-ui, sans-serif; letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <canvas id="brush-studio-canvas"></canvas>
    <div id="loading">loading Brush Studio…</div>
  </body>
</html>
