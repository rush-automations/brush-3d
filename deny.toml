# `cargo deny check licenses`: the engine stays permissively licensed, so no copyleft dependency may enter.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
